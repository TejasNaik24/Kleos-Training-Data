[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kleos-training-data"
version = "0.1.0"
description = "Private collection, review, sanitization and release pipeline for KLEOS training datasets"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "KLEOS Research" }]
keywords = ["dataset", "privacy", "sanitization", "provenance", "reproducibility"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Science/Research",
]

dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]
collect = [
  "httpx>=0.27",
]
review = [
  "anthropic>=0.40",
]
compat = [
  "kleos-models @ git+https://github.com/TejasNaik24/Kleos-Models.git@12361d53cf329c897ec14daede6d14112a3e8f20",
]
all = [
  "kleos-training-data[dev,collect,review]",
]

[project.urls]
Homepage = "https://github.com/TejasNaik24/Kleos-Training-Data"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/kleos_training_data"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "B",
  "C4",
  "UP",
  "SIM",
  "RUF",
]
ignore = [
  "E501",
  "B008",
  "SIM108",
  "UP042",
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"scripts/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["kleos_training_data"]

[tool.mypy]
python_version = "3.12"
files = ["src/kleos_training_data"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["kleos_models.*", "httpx.*", "anthropic.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = [
  "requires_kleos_models: differential test needing the pinned public package (skipped otherwise)",
  "requires_network: test performs real network I/O (never run in CI)",
  "slow: end-to-end test running the full pipeline",
]

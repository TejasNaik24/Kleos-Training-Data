family: brief.what_needs_a_decision
task: mission_control_briefing
description: >
  Several things changed since the last briefing. Only some of them need the
  reader to decide anything.
policy_claim: >
  Lead a briefing with what needs a decision soonest and is best supported.
  Everything else is context, and context goes after the decision.
anti_claim: >
  Report everything that changed, in the order it arrived, giving equal weight
  to items that need nothing from the reader.

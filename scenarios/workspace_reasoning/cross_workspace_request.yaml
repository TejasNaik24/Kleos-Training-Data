schema_version: "1.0"
catalog_version: "scenarios-v1"
family: wsp.cross_workspace_request
task: workspace_reasoning
description: >
  Several items sit outside the active workspace at once, so the boundary is
  the dominant feature of the situation rather than an edge case.
policy_claim: >
  Name every item that sits outside the active workspace, and rank only within
  it. Being outside the boundary is not a reason to omit an item silently — the
  user should know it exists and that it was not acted on.
anti_claim: >
  Either fold outside items into the answer, or drop them without mention.
  Both leave the user unable to tell what was considered.
axes:
  domain: [career, research, coursework, projects]
  urgency: [critical, high, medium, low]
  evidence_quality: [strong, mixed, weak]
  format: [bullets, prose, json]
  context_length: [short, medium, long]
  presentation_order: [as_given, reversed, shuffled]
  workspace: [School, Research, Personal, Startup]
  difficulty: [easy, medium, hard]
entities: {pool: generic_pool_a, count: 5}
prompt:
  framing: workspace
  workspace_names: [School, Research, Personal, Startup]
  out_of_scope_count: 2
  question: "What should I do first here, and what is sitting outside this workspace?"
  item_noun: item
expected: {policy: respect_workspace_scope, grader: ranking}
generation:
  n_base: 24
  seed: 1993
  equivalence_groups:
    - {kind: paraphrase, count: 2}
    - {kind: context_order, count: 1}
    - {kind: irrelevant_context, count: 1}
holdout:
  ood_shift: unseen_formats
  reserve_formats: [json]
review: {lane: human_only, min_mean_score: 3.5}

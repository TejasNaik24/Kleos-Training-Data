name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"
  KLEOS_ALLOW_PRODUCTION_CAPTURE: ""

jobs:
  privacy:
    name: private-data scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan for secrets and private data
        run: python scripts/check_no_private_data.py .

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy src/kleos_training_data

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -v --tb=short

  workspace:
    name: workspace and ignore rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python scripts/init_workspace.py
      - name: Nothing new is committable
        run: |
          git add -A --dry-run 2>/dev/null | tee /tmp/staged.txt
          if grep -Eq "(staging|vault|releases|reports)/[^.]" /tmp/staged.txt; then
            echo "::error::init_workspace.py produced a committable path in a runtime zone"
            exit 4
          fi

  compat:
    name: contract compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,compat]"
      - run: pytest -v -m requires_kleos_models
      - run: python scripts/check_contract_compat.py --strict --show-deltas

  slice:
    name: vertical slice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make install
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: python scripts/init_workspace.py
      - run: python scripts/doctor.py
      - run: make slice-clean slice
      - run: python scripts/verify_release.py --release releases/kleos-policy-v0.0.1 --strict
